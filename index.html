<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D World HD Globe Background</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library for 3D Globe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for smooth interaction -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;600;700&family=Noto+Sans+Arabic:wght@400;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617;
            font-family: 'Inter', 'Noto Sans Arabic', sans-serif;
            color: #fff;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Studio Ultra-Wide Screen Container */
        .studio-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at center, #0b1528 0%, #020617 85%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Studio Background Grid Animation */
        .tech-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(14, 165, 233, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(14, 165, 233, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        /* Studio Light Flares */
        .flare-left {
            position: absolute;
            top: -10%;
            left: 5%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(50px);
            pointer-events: none;
            z-index: 1;
        }

        .flare-right {
            position: absolute;
            top: -10%;
            right: 5%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(50px);
            pointer-events: none;
            z-index: 1;
        }

        /* Canvas container */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Glowing HUD Rings */
        .center-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 3;
            border-radius: 50%;
            border: 1px dashed rgba(56, 189, 248, 0.25);
            animation: spin 60s linear infinite;
        }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Glass HUD Panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-gold {
            background: rgba(20, 16, 8, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(234, 179, 8, 0.35);
        }
    </style>
</head>
<body>
    <div class="studio-container relative w-full h-screen overflow-hidden">
        
        <!-- Tech grid background -->
        <div class="tech-grid"></div>
        <div class="flare-left"></div>
        <div class="flare-right"></div>

        <!-- Ambient HUD Rings around center Globe -->
        <div class="center-ring w-[650px] h-[650px] md:w-[780px] md:h-[780px] border-cyan-500/25"></div>
        <div class="center-ring w-[700px] h-[700px] md:w-[840px] md:h-[840px] border-amber-500/15" style="animation-direction: reverse; animation-duration: 90s;"></div>

        <!-- 3D Globe Canvas -->
        <div id="canvas-container"></div>

        <!-- MINIMAL TOP OVERLAY FOR GLOBE CONTROL -->
        <div class="relative z-20 flex justify-between items-center px-6 py-3 m-4">
            <div class="glass-panel px-4 py-2 rounded-xl border border-cyan-500/30 flex items-center gap-3">
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                <span class="font-orbitron text-xs text-cyan-200 tracking-wider">3184 × 1080 ULTRA-HD GLOBE</span>
            </div>
            
            <div class="flex gap-2">
                <button id="toggle-rotation" class="glass-panel hover:bg-cyan-900/40 text-cyan-200 px-3 py-2 rounded-lg text-xs flex items-center gap-2 border border-cyan-500/40 transition">
                    <i class="fa-solid fa-rotate text-cyan-400"></i> Rotate
                </button>
                <button id="btn-reset-cam" class="glass-panel hover:bg-cyan-900/40 text-cyan-200 px-3 py-2 rounded-lg text-xs flex items-center gap-2 border border-cyan-500/40 transition">
                    <i class="fa-solid fa-crosshairs text-amber-400"></i> Center
                </button>
            </div>
        </div>

        <!-- FLOATING COUNTRY TOOLTIP -->
        <div id="country-card" class="absolute z-20 top-20 left-6 glass-gold p-4 rounded-xl w-72 shadow-2xl transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-none">
            <div class="flex justify-between items-start mb-2 border-b border-yellow-500/20 pb-2">
                <div>
                    <h3 id="card-country-name" class="font-bold text-lg text-yellow-300 font-orbitron">Select Location</h3>
                    <div id="card-country-kurdish" class="text-xs text-gray-300 font-medium" dir="rtl">ناوچە هەڵبژێرە</div>
                </div>
                <span class="bg-yellow-500/20 text-yellow-300 text-[10px] font-mono px-2 py-0.5 rounded border border-yellow-500/30">GEO-DATA</span>
            </div>
            <div class="space-y-1.5 text-xs">
                <div class="flex justify-between text-gray-300">
                    <span>Continent / کیشوەر:</span>
                    <span id="card-region" class="text-cyan-300 font-medium">-</span>
                </div>
                <div class="flex justify-between text-gray-300">
                    <span>Coordinates:</span>
                    <span id="card-coords" class="text-amber-300 font-mono text-[11px]">0° N, 0° E</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        const container = document.getElementById('canvas-container');
        let scene, camera, renderer, controls;
        let globeGroup, earthMesh, borderGroup, pointsGroup;
        let autoRotate = true;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // High accuracy lat/lon coordinate outlines for all world continents
        const CONTINENTS = [
            // AFRICA
            { name: "Africa", pts: [[37,10],[32,32],[12,43],[-11,41],[-34,26],[-34,18],[5,9],[5,-5],[15,-17],[30,-10],[37,10]] },
            // EURASIA (Europe & Asia)
            { name: "Eurasia", pts: [[71,28],[70,180],[35,140],[22,114],[10,105],[8,77],[25,62],[12,44],[30,32],[41,28],[36,-5],[44,-9],[58,-6],[71,28]] },
            // ARABIAN PENINSULA
            { name: "Arabia", pts: [[30,32],[30,48],[12,44],[12,54],[24,56],[30,48]] },
            // NORTH AMERICA
            { name: "North America", pts: [[72,-168],[70,-60],[47,-52],[25,-80],[15,-88],[8,-77],[16,-93],[30,-115],[50,-125],[60,-140],[72,-168]] },
            // SOUTH AMERICA
            { name: "South America", pts: [[12,-73],[7,-50],[-5,-35],[-23,-42],[-55,-68],[-45,-75],[-18,-70],[0,-80],[12,-73]] },
            // AUSTRALIA
            { name: "Australia", pts: [[-12,131],[-12,143],[-25,153],[-38,148],[-35,117],[-22,114],[-12,131]] },
            // ANTARCTICA
            { name: "Antarctica", pts: [[-65,-180],[-65,-90],[-65,0],[-65,90],[-65,180],[-85,180],[-85,-180]] },
            // GREENLAND
            { name: "Greenland", pts: [[78,-68],[82,-30],[68,-20],[60,-44],[78,-68]] },
            // MADAGASCAR
            { name: "Madagascar", pts: [[-12,49],[-16,50],[-25,47],[-25,44],[-12,49]] },
            // JAPAN
            { name: "Japan", pts: [[45,142],[35,140],[31,130],[38,138],[45,142]] },
            // BRITAIN & IRELAND
            { name: "UK & Ireland", pts: [[58,-5],[50,-5],[50,1],[58,1],[58,-5]] }
        ];

        // Key Hotspots & Major Hubs
        const worldHotspots = [
            { name: "Erbil", kurdish: "ئەربیل", lat: 36.19, lon: 44.01, region: "Middle East" },
            { name: "Baghdad", kurdish: "بەغدا", lat: 33.31, lon: 44.36, region: "Middle East" },
            { name: "London", kurdish: "لەندەن", lat: 51.50, lon: -0.12, region: "Europe" },
            { name: "New York", kurdish: "نیویۆرک", lat: 40.71, lon: -74.00, region: "North America" },
            { name: "Tokyo", kurdish: "تۆکیۆ", lat: 35.67, lon: 139.65, region: "Asia" },
            { name: "Paris", kurdish: "پاریس", lat: 48.85, lon: 2.35, region: "Europe" },
            { name: "Beijing", kurdish: "پەکین", lat: 39.90, lon: 116.40, region: "Asia" },
            { name: "Sydney", kurdish: "سیدنی", lat: -33.86, lon: 151.20, region: "Oceania" },
            { name: "Cairo", kurdish: "قاهیرە", lat: 30.04, lon: 31.23, region: "Africa" },
            { name: "Rio de Janeiro", kurdish: "ریۆ دی ژانیرۆ", lat: -22.90, lon: -43.17, region: "South America" },
            { name: "Berlin", kurdish: "بەرلین", lat: 52.52, lon: 13.40, region: "Europe" }
        ];

        function init3D() {
            scene = new THREE.Scene();

            // Camera Setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 260);

            // WebGL Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.8;
            controls.minDistance = 140;
            controls.maxDistance = 420;
            controls.enablePan = false;

            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0x0e2a47, 2.0);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0x38bdf8, 2.8);
            mainLight.position.set(200, 150, 200);
            scene.add(mainLight);

            const goldRim = new THREE.DirectionalLight(0xfacc15, 2.2);
            goldRim.position.set(-200, -100, -150);
            scene.add(goldRim);

            createEarthSphere();
            createAtmosphere();
            createCountryBorders();
            createHotspotMarkers();
            createParticleField();

            // Window Resize & Interactivity
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousemove', onRaycastHover);

            document.getElementById('toggle-rotation').addEventListener('click', () => {
                autoRotate = !autoRotate;
            });

            document.getElementById('btn-reset-cam').addEventListener('click', () => {
                camera.position.set(0, 0, 260);
                controls.reset();
            });

            animate();
        }

        function createEarthSphere() {
            const sphereGeo = new THREE.SphereGeometry(80, 128, 128);

            // Canvas texture to render high definition map
            const canvas = document.createElement('canvas');
            canvas.width = 4096;
            canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            // Deep ocean background
            ctx.fillStyle = '#030d22';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Latitude & Longitude Grid
            ctx.strokeStyle = 'rgba(14, 165, 233, 0.15)';
            ctx.lineWidth = 1.5;

            for (let x = 0; x <= canvas.width; x += 128) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += 128) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw Real Continents using Projection Formula
            CONTINENTS.forEach(cont => {
                ctx.beginPath();
                cont.pts.forEach((pt, idx) => {
                    const lat = pt[0];
                    const lon = pt[1];
                    const x = ((lon + 180) / 360) * canvas.width;
                    const y = ((90 - lat) / 180) * canvas.height;

                    if (idx === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.closePath();

                // Continent Landmass Fill & Glow
                ctx.fillStyle = '#0f3860';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 15;
                ctx.fill();

                // Bright Shoreline Outline
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 4;
                ctx.stroke();
            });

            // Add fine detail land dots inside continental landmasses
            ctx.fillStyle = '#1e5285';
            CONTINENTS.forEach(cont => {
                const minLat = Math.min(...cont.pts.map(p => p[0]));
                const maxLat = Math.max(...cont.pts.map(p => p[0]));
                const minLon = Math.min(...cont.pts.map(p => p[1]));
                const maxLon = Math.max(...cont.pts.map(p => p[1]));

                for (let i = 0; i < 400; i++) {
                    const lat = minLat + Math.random() * (maxLat - minLat);
                    const lon = minLon + Math.random() * (maxLon - minLon);
                    const x = ((lon + 180) / 360) * canvas.width;
                    const y = ((90 - lat) / 180) * canvas.height;

                    ctx.beginPath();
                    ctx.arc(x, y, Math.random() * 6 + 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            const texture = new THREE.CanvasTexture(canvas);

            const earthMat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.45,
                metalness: 0.25,
                emissive: 0x071b30,
                emissiveIntensity: 0.7
            });

            earthMesh = new THREE.Mesh(sphereGeo, earthMat);
            globeGroup.add(earthMesh);
        }

        function createAtmosphere() {
            const atmosGeo = new THREE.SphereGeometry(85, 64, 64);
            const atmosMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.15,
                side: THREE.BackSide
            });
            const atmosphereMesh = new THREE.Mesh(atmosGeo, atmosMat);
            globeGroup.add(atmosphereMesh);
        }

        function createCountryBorders() {
            borderGroup = new THREE.Group();
            
            // Render country border outlines over continents
            const borderMat = new THREE.LineBasicMaterial({ 
                color: 0x7dd3fc, 
                transparent: true, 
                opacity: 0.8 
            });

            CONTINENTS.forEach(cont => {
                const points = [];
                cont.pts.forEach(pt => {
                    const pos = latLongToVector3(pt[0], pt[1], 80.8);
                    points.push(pos);
                });

                const borderGeo = new THREE.BufferGeometry().setFromPoints(points);
                const borderLine = new THREE.LineLoop(borderGeo, borderMat);
                borderGroup.add(borderLine);
            });

            // Generate additional internal country boundary grid lines across world
            const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 });
            for (let i = 0; i < 180; i++) {
                const lat = (Math.random() - 0.5) * 140;
                const lon = (Math.random() - 0.5) * 360;
                const len = Math.random() * 8 + 4;

                const p1 = latLongToVector3(lat, lon, 80.6);
                const p2 = latLongToVector3(lat + (Math.random() - 0.5) * len, lon + (Math.random() - 0.5) * len, 80.6);

                const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                const line = new THREE.Line(geo, lineMat);
                borderGroup.add(line);
            }

            globeGroup.add(borderGroup);
        }

        function createHotspotMarkers() {
            pointsGroup = new THREE.Group();

            const markerGeo = new THREE.SphereGeometry(1.3, 16, 16);
            const markerMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

            worldHotspots.forEach(spot => {
                const pos = latLongToVector3(spot.lat, spot.lon, 81.2);
                const marker = new THREE.Mesh(markerGeo, markerMat);
                marker.position.copy(pos);
                marker.userData = spot;

                // Pulsing ring
                const ringGeo = new THREE.RingGeometry(1.8, 2.5, 16);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.copy(pos);
                ring.lookAt(0, 0, 0);

                pointsGroup.add(marker);
                pointsGroup.add(ring);
            });

            globeGroup.add(pointsGroup);
        }

        function createParticleField() {
            const particleCount = 500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 550;
                positions[i + 1] = (Math.random() - 0.5) * 550;
                positions[i + 2] = (Math.random() - 0.5) * 550;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0x38bdf8,
                size: 1.4,
                transparent: true,
                opacity: 0.45
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function latLongToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = radius * Math.sin(phi) * Math.sin(theta);
            const y = radius * Math.cos(phi);

            return new THREE.Vector3(x, y, z);
        }

        function onRaycastHover(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pointsGroup.children);

            const card = document.getElementById('country-card');

            if (intersects.length > 0) {
                const target = intersects[0].object;
                if (target.userData && target.userData.name) {
                    const data = target.userData;
                    document.getElementById('card-country-name').textContent = data.name.toUpperCase();
                    document.getElementById('card-country-kurdish').textContent = data.kurdish;
                    document.getElementById('card-region').textContent = data.region;
                    document.getElementById('card-coords').textContent = `${data.lat.toFixed(2)}° N, ${data.lon.toFixed(2)}° E`;

                    card.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
                    card.classList.add('opacity-100', 'translate-y-0');
                    return;
                }
            }

            card.classList.remove('opacity-100', 'translate-y-0');
            card.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate && globeGroup) {
                globeGroup.rotation.y += 0.0022;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = function() {
            init3D();
        };
    </script>
</body>
</html>
