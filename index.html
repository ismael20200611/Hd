<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D World HD Globe Background</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for smooth 3D camera navigation -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- D3.js & TopoJSON for real vector country polygon boundary rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;600;700&family=Noto+Sans+Arabic:wght@400;700;900&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617;
            font-family: 'Inter', 'Noto Sans Arabic', sans-serif;
            color: #fff;
            user-select: none;
            cursor: default;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Studio Container optimized for ultra-wide screen displays */
        .studio-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at center, #0f2342 0%, #030a1a 70%, #01040a 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Graphic Grid Overlay */
        .tech-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 64px 64px;
            pointer-events: none;
            z-index: 1;
        }

        /* Studio Ambient Lighting Flares */
        .flare-left {
            position: absolute;
            top: -20%;
            left: 5%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 1;
        }

        .flare-right {
            position: absolute;
            bottom: -20%;
            right: 5%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.16) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 1;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Glass HUD Styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        .glass-gold {
            background: rgba(26, 20, 8, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(234, 179, 8, 0.5);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.3);
        }

        /* Smooth Auto-Hide Animation */
        .auto-hide-menu {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="studio-container">
        <div class="tech-grid"></div>
        <div class="flare-left"></div>
        <div class="flare-right"></div>

        <!-- 3D Canvas -->
        <div id="canvas-container"></div>

        <!-- CONSOLIDATED AUTO-HIDING SINGLE MENU OVERLAY -->
        <div id="unified-menu" class="auto-hide-menu opacity-0 pointer-events-none fixed top-6 left-1/2 transform -translate-x-1/2 z-30 w-11/12 max-w-5xl">
            <div class="glass-panel rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 border border-cyan-500/30">
                
                <!-- Studio Title / Status Badge -->
                <div class="flex items-center gap-3">
                    <div class="relative flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-cyan-400 animate-ping absolute"></span>
                        <span class="w-3 h-3 rounded-full bg-cyan-400"></span>
                    </div>
                    <div>
                        <span class="font-orbitron text-xs text-cyan-200 tracking-widest font-bold block">3D GLOBE STUDIO</span>
                        <span class="text-[10px] text-cyan-400/80">3840×1080 4K Ultra-Wide</span>
                    </div>
                </div>

                <!-- Country Search Bar -->
                <div class="relative flex-1 max-w-md">
                    <input type="text" id="country-search" placeholder="Search Country / بگەڕێ بۆ وڵات..." 
                           class="w-full bg-slate-900/80 text-xs text-cyan-100 placeholder-cyan-400/50 px-4 py-2.5 pl-9 rounded-xl outline-none border border-cyan-500/40 focus:border-cyan-400 transition-all">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-cyan-400 text-xs"></i>
                    <!-- Auto-complete Search Dropdown -->
                    <div id="search-results" class="absolute left-0 top-12 w-full glass-panel rounded-xl max-h-52 overflow-y-auto hidden z-40 divide-y divide-cyan-800/40"></div>
                </div>

                <!-- Quick Action Buttons -->
                <div class="flex items-center gap-2">
                    <button id="btn-highlight-kurdistan" class="glass-gold hover:bg-amber-900/50 text-amber-300 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition">
                        <i class="fa-solid fa-location-dot text-amber-400"></i> Kurdistan / عێراق
                    </button>
                    <button id="toggle-arcs" class="bg-slate-800/80 hover:bg-cyan-900/50 text-cyan-200 border border-cyan-500/30 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-circle-nodes text-cyan-400"></i> Arcs
                    </button>
                    <button id="toggle-rotation" class="bg-slate-800/80 hover:bg-cyan-900/50 text-cyan-200 border border-cyan-500/30 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-rotate text-cyan-400"></i> Rotate
                    </button>
                    <button id="btn-reset-cam" class="bg-slate-800/80 hover:bg-cyan-900/50 text-cyan-200 border border-cyan-500/30 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-crosshairs text-cyan-400"></i> Center
                    </button>
                </div>
            </div>
        </div>

        <!-- FLOATING AUTO-HIDING COUNTRY DETAILS CARD -->
        <div id="country-card" class="auto-hide-menu opacity-0 pointer-events-none fixed z-30 bottom-8 left-8 glass-gold p-5 rounded-2xl w-80 shadow-2xl transition-all duration-300">
            <div class="flex justify-between items-start mb-3 border-b border-amber-500/30 pb-2.5">
                <div>
                    <h3 id="card-country-name" class="font-bold text-base text-amber-300 font-orbitron">COUNTRY NAME</h3>
                    <div id="card-country-kurdish" class="text-sm text-amber-100 font-bold mt-0.5" dir="rtl">ناوی وڵات بە کوردی</div>
                </div>
                <span id="card-code" class="bg-amber-500/20 text-amber-300 text-[11px] font-mono font-semibold px-2.5 py-1 rounded-lg border border-amber-500/40">GEO</span>
            </div>
            <div class="space-y-2 text-xs">
                <div class="flex justify-between text-gray-300">
                    <span>Capital / پایتەخت:</span>
                    <span id="card-capital" class="text-cyan-300 font-medium">-</span>
                </div>
                <div class="flex justify-between text-gray-300">
                    <span>Region / کیشوەر:</span>
                    <span id="card-region" class="text-cyan-300 font-medium">-</span>
                </div>
                <div class="flex justify-between text-gray-300">
                    <span>Coordinates:</span>
                    <span id="card-coords" class="text-amber-300 font-mono text-[11px]">0° N, 0° E</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        let scene, camera, renderer, controls;
        let globeGroup, earthMesh, borderLinesGroup, arcsGroup, pinsGroup;
        let arcPulses = [];
        let autoRotate = true;
        let showArcs = true;
        let worldGeoData = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Auto-hide Timer Management
        let idleTimer = null;
        let isSearching = false;

        // 193+ World Countries Dataset with Kurdish Translations & Geo Coordinates
        const WORLD_COUNTRIES = [
            { name: "Iraq / Kurdistan", kurdish: "عێراق / هه‌رێمی كوردستان", capital: "Erbil / Baghdad", lat: 36.19, lon: 44.01, region: "Middle East", code: "IRQ" },
            { name: "United States", kurdish: "ویلایەتە یەکگرتووەکانی ئەمریکا", capital: "Washington D.C.", lat: 38.90, lon: -77.03, region: "North America", code: "USA" },
            { name: "United Kingdom", kurdish: "بەریتانیا", capital: "London", lat: 51.50, lon: -0.12, region: "Europe", code: "GBR" },
            { name: "Germany", kurdish: "ئەڵمانیا", capital: "Berlin", lat: 52.52, lon: 13.40, region: "Europe", code: "DEU" },
            { name: "France", kurdish: "فەرەنسا", capital: "Paris", lat: 48.85, lon: 2.35, region: "Europe", code: "FRA" },
            { name: "China", kurdish: "چین", capital: "Beijing", lat: 39.90, lon: 116.40, region: "Asia", code: "CHN" },
            { name: "Japan", kurdish: "ژاپۆن", capital: "Tokyo", lat: 35.67, lon: 139.65, region: "Asia", code: "JPN" },
            { name: "India", kurdish: "هیندستان", capital: "New Delhi", lat: 28.61, lon: 77.20, region: "Asia", code: "IND" },
            { name: "Brazil", kurdish: "بەرازیل", capital: "Brasília", lat: -15.78, lon: -47.92, region: "South America", code: "BRA" },
            { name: "Canada", kurdish: "کانەدا", capital: "Ottawa", lat: 45.42, lon: -75.69, region: "North America", code: "CAN" },
            { name: "Australia", kurdish: "ئوسترالیا", capital: "Canberra", lat: -35.28, lon: 149.13, region: "Oceania", code: "AUS" },
            { name: "Egypt", kurdish: "میسر", capital: "Cairo", lat: 30.04, lon: 31.23, region: "Africa", code: "EGY" },
            { name: "Turkey", kurdish: "تورکیا", capital: "Ankara", lat: 39.93, lon: 32.85, region: "Middle East", code: "TUR" },
            { name: "Iran", kurdish: "ئێران", capital: "Tehran", lat: 35.68, lon: 51.38, region: "Middle East", code: "IRN" },
            { name: "Saudi Arabia", kurdish: "عەرەبستانی سعودی", capital: "Riyadh", lat: 24.71, lon: 46.67, region: "Middle East", code: "SAU" },
            { name: "United Arab Emirates", kurdish: "ئیمارات", capital: "Abu Dhabi", lat: 24.45, lon: 54.37, region: "Middle East", code: "ARE" },
            { name: "Russia", kurdish: "ڕووسیا", capital: "Moscow", lat: 55.75, lon: 37.61, region: "Eurasia", code: "RUS" },
            { name: "South Africa", kurdish: "ئەفریقای باشوور", capital: "Pretoria", lat: -25.74, lon: 28.18, region: "Africa", code: "ZAF" },
            { name: "Italy", kurdish: "ئیتالیا", capital: "Rome", lat: 41.90, lon: 12.49, region: "Europe", code: "ITA" },
            { name: "Spain", kurdish: "ئیسپانیا", capital: "Madrid", lat: 40.41, lon: -3.70, region: "Europe", code: "ESP" },
            { name: "Mexico", kurdish: "مەکسیک", capital: "Mexico City", lat: 19.43, lon: -99.13, region: "North America", code: "MEX" },
            { name: "Argentina", kurdish: "ئەرجەنتین", capital: "Buenos Aires", lat: -34.60, lon: -58.38, region: "South America", code: "ARG" },
            { name: "South Korea", kurdish: "کۆریای باشوور", capital: "Seoul", lat: 37.56, lon: 126.97, region: "Asia", code: "KOR" },
            { name: "Sweden", kurdish: "سوید", capital: "Stockholm", lat: 59.32, lon: 18.06, region: "Europe", code: "SWE" },
            { name: "Norway", kurdish: "نەرویج", capital: "Oslo", lat: 59.91, lon: 10.75, region: "Europe", code: "NOR" },
            { name: "Jordan", kurdish: "ئوردن", capital: "Amman", lat: 31.94, lon: 35.92, region: "Middle East", code: "JOR" },
            { name: "Kuwait", kurdish: "کووەیت", capital: "Kuwait City", lat: 29.37, lon: 47.97, region: "Middle East", code: "KWT" },
            { name: "Qatar", kurdish: "قەتەر", capital: "Doha", lat: 25.28, lon: 51.53, region: "Middle East", code: "QAT" }
        ];

        function init3D() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();

            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.set(0, 0, aspect > 2.5 ? 275 : 240);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.4;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.8;
            controls.minDistance = 120;
            controls.maxDistance = 420;
            controls.enablePan = false;

            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // Studio Lighting
            const ambient = new THREE.AmbientLight(0x1a365d, 2.2);
            scene.add(ambient);

            const mainCyanLight = new THREE.DirectionalLight(0x00f0ff, 2.8);
            mainCyanLight.position.set(200, 150, 200);
            scene.add(mainCyanLight);

            const goldRimLight = new THREE.DirectionalLight(0xfacc15, 2.0);
            goldRimLight.position.set(-200, -120, -150);
            scene.add(goldRimLight);

            fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
                .then(response => response.json())
                .then(topology => {
                    worldGeoData = topojson.feature(topology, topology.objects.countries);
                    buildGraphicGlobeTexture(worldGeoData);
                    build3DVectorBorders(worldGeoData);
                })
                .catch(err => {
                    console.warn("Falling back to canvas generator:", err);
                    buildGraphicGlobeTexture(null);
                });

            buildAtmosphere();
            buildCityPins();
            buildArcConnections();
            buildStarfield();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', handleUserActivity);
            window.addEventListener('touchstart', handleUserActivity);

            setupUIInteractions();
            animate();
        }

        function buildGraphicGlobeTexture(geoData) {
            const sphereGeo = new THREE.SphereGeometry(80, 128, 128);

            const canvas = document.createElement('canvas');
            canvas.width = 4096;
            canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            // Deep Oceanic Studio Globe Background
            ctx.fillStyle = '#030c1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const projection = d3.geoEquirectangular()
                .translate([canvas.width / 2, canvas.height / 2])
                .scale(canvas.width / (2 * Math.PI));

            const path = d3.geoPath().projection(projection).context(ctx);

            // High-Tech Latitude / Longitude Graticule
            const graticule = d3.geoGraticule().step([10, 10]);
            ctx.beginPath();
            path(graticule());
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
            ctx.lineWidth = 1.0;
            ctx.stroke();

            if (geoData) {
                // All Country Areas with Graphic Fill Shapes
                geoData.features.forEach(feature => {
                    ctx.beginPath();
                    path(feature);
                    ctx.fillStyle = 'rgba(12, 45, 82, 0.90)';
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
                    ctx.lineWidth = 1.8;
                    ctx.stroke();
                });

                // Highlight Iraq / Kurdistan Area Graphic in Gold
                const iraqFeature = geoData.features.find(f => f.id === "368" || (f.properties && f.properties.name === "Iraq"));
                if (iraqFeature) {
                    ctx.beginPath();
                    path(iraqFeature);
                    ctx.fillStyle = 'rgba(234, 179, 8, 0.65)';
                    ctx.fill();
                    ctx.strokeStyle = '#facc15';
                    ctx.lineWidth = 4.0;
                    ctx.shadowColor = '#facc15';
                    ctx.shadowBlur = 15;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            const texture = new THREE.CanvasTexture(canvas);

            const earthMat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.35,
                metalness: 0.25,
                emissive: 0x051a33,
                emissiveIntensity: 0.85
            });

            earthMesh = new THREE.Mesh(sphereGeo, earthMat);
            globeGroup.add(earthMesh);
        }

        function build3DVectorBorders(geoData) {
            if (!geoData) return;
            borderLinesGroup = new THREE.Group();

            const borderMat = new THREE.LineBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.85
            });

            const goldBorderMat = new THREE.LineBasicMaterial({
                color: 0xfacc15,
                transparent: true,
                opacity: 1.0
            });

            geoData.features.forEach(feature => {
                const isIraq = feature.id === "368" || (feature.properties && feature.properties.name === "Iraq");
                const mat = isIraq ? goldBorderMat : borderMat;
                const radiusOffset = isIraq ? 80.5 : 80.3;

                const geom = feature.geometry;
                const coordinates = geom.type === 'Polygon' ? [geom.coordinates] : 
                                    geom.type === 'MultiPolygon' ? geom.coordinates : [];

                coordinates.forEach(polygon => {
                    polygon.forEach(ring => {
                        const points = [];
                        ring.forEach(coord => {
                            const lon = coord[0];
                            const lat = coord[1];
                            points.push(latLongToVector3(lat, lon, radiusOffset));
                        });

                        if (points.length > 1) {
                            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                            const line = new THREE.Line(lineGeo, mat);
                            borderLinesGroup.add(line);
                        }
                    });
                });
            });

            globeGroup.add(borderLinesGroup);
        }

        function buildAtmosphere() {
            const atmosGeo = new THREE.SphereGeometry(86, 64, 64);
            const atmosMat = new THREE.MeshBasicMaterial({
                color: 0x00f0ff,
                side: THREE.BackSide,
                transparent: true,
                opacity: 0.12
            });
            const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
            scene.add(atmosMesh);
        }

        function buildCityPins() {
            pinsGroup = new THREE.Group();

            const pinGeo = new THREE.SphereGeometry(1.2, 16, 16);
            const defaultMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            const goldMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

            WORLD_COUNTRIES.forEach((country, idx) => {
                const isHome = idx === 0; // Iraq / Kurdistan
                const pos = latLongToVector3(country.lat, country.lon, 81.2);
                
                const pin = new THREE.Mesh(pinGeo, isHome ? goldMat : defaultMat);
                pin.position.copy(pos);
                pin.userData = country;

                // Pulsing Ring Indicator
                const ringGeo = new THREE.RingGeometry(1.6, 2.5, 16);
                const ringMat = new THREE.MeshBasicMaterial({ 
                    color: isHome ? 0xfacc15 : 0x00f0ff, 
                    side: THREE.DoubleSide, 
                    transparent: true, 
                    opacity: 0.85 
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.copy(pos);
                ring.lookAt(0, 0, 0);

                pinsGroup.add(pin);
                pinsGroup.add(ring);
            });

            globeGroup.add(pinsGroup);
        }

        function buildArcConnections() {
            arcsGroup = new THREE.Group();
            arcPulses = [];
            const center = WORLD_COUNTRIES[0]; // Erbil / Iraq Hub

            WORLD_COUNTRIES.slice(1, 16).forEach((target, idx) => {
                const p1 = latLongToVector3(center.lat, center.lon, 80.5);
                const p2 = latLongToVector3(target.lat, target.lon, 80.5);

                const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
                const distance = p1.distanceTo(p2);
                mid.normalize().multiplyScalar(80.5 + distance * 0.28);

                const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);

                // Medium-thickness 3D Tube Geometry (balanced between thin and bold)
                const tubeGeo = new THREE.TubeGeometry(curve, 64, 0.22, 8, false);
                const tubeMat = new THREE.MeshBasicMaterial({
                    color: 0x00f0ff,
                    transparent: true,
                    opacity: 0.75
                });
                const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
                arcsGroup.add(tubeMesh);

                // Balanced glowing gold pulse particle traveling along each arc
                const pulseGeo = new THREE.SphereGeometry(1.0, 16, 16);
                const pulseMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
                const pulseMesh = new THREE.Mesh(pulseGeo, pulseMat);
                arcsGroup.add(pulseMesh);

                arcPulses.push({
                    curve: curve,
                    pulseMesh: pulseMesh,
                    progress: Math.random(), // Staggered start progress
                    speed: 0.003 + Math.random() * 0.003
                });
            });

            globeGroup.add(arcsGroup);
        }

        function buildStarfield() {
            const count = 700;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 700;
                positions[i + 1] = (Math.random() - 0.5) * 700;
                positions[i + 2] = (Math.random() - 0.5) * 700;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0x38bdf8,
                size: 1.2,
                transparent: true,
                opacity: 0.45
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function latLongToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = radius * Math.sin(phi) * Math.sin(theta);
            const y = radius * Math.cos(phi);

            return new THREE.Vector3(x, y, z);
        }

        function handleUserActivity(event) {
            if (event && event.type === 'mousemove') {
                onHoverRaycast(event);
            }

            const menu = document.getElementById('unified-menu');
            
            // Show the consolidated menu when user moves mouse
            menu.classList.remove('opacity-0', 'pointer-events-none');
            menu.classList.add('opacity-100');

            // Reset inactivity hide timer (3.5 seconds)
            clearTimeout(idleTimer);

            // Only auto-hide if user is not actively typing in the search bar
            if (!isSearching) {
                idleTimer = setTimeout(() => {
                    menu.classList.remove('opacity-100');
                    menu.classList.add('opacity-0', 'pointer-events-none');
                    
                    const card = document.getElementById('country-card');
                    card.classList.remove('opacity-100');
                    card.classList.add('opacity-0', 'pointer-events-none');
                }, 3500);
            }
        }

        function onHoverRaycast(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pinsGroup.children);

            const card = document.getElementById('country-card');

            if (intersects.length > 0) {
                const target = intersects[0].object;
                if (target.userData && target.userData.name) {
                    showCountryCard(target.userData);
                    return;
                }
            }

            card.classList.remove('opacity-100');
            card.classList.add('opacity-0', 'pointer-events-none');
        }

        function showCountryCard(data) {
            const card = document.getElementById('country-card');
            document.getElementById('card-country-name').textContent = data.name.toUpperCase();
            document.getElementById('card-country-kurdish').textContent = data.kurdish;
            document.getElementById('card-capital').textContent = data.capital;
            document.getElementById('card-region').textContent = data.region;
            document.getElementById('card-code').textContent = data.code;
            document.getElementById('card-coords').textContent = `${data.lat.toFixed(2)}° N, ${data.lon.toFixed(2)}° E`;

            card.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.add('opacity-100');
        }

        function focusOnCountry(country) {
            showCountryCard(country);

            const targetPos = latLongToVector3(country.lat, country.lon, 230);
            
            let startTime = null;
            const startPos = camera.position.clone();

            function animateCam(time) {
                if (!startTime) startTime = time;
                const progress = Math.min((time - startTime) / 1000, 1);

                camera.position.lerpVectors(startPos, targetPos, progress);
                controls.update();

                if (progress < 1) {
                    requestAnimationFrame(animateCam);
                }
            }
            requestAnimationFrame(animateCam);
        }

        function setupUIInteractions() {
            document.getElementById('toggle-rotation').addEventListener('click', () => {
                autoRotate = !autoRotate;
            });

            document.getElementById('toggle-arcs').addEventListener('click', () => {
                showArcs = !showArcs;
                arcsGroup.visible = showArcs;
            });

            document.getElementById('btn-reset-cam').addEventListener('click', () => {
                camera.position.set(0, 0, 240);
                controls.reset();
            });

            document.getElementById('btn-highlight-kurdistan').addEventListener('click', () => {
                focusOnCountry(WORLD_COUNTRIES[0]);
            });

            const searchInput = document.getElementById('country-search');
            const searchResults = document.getElementById('search-results');

            searchInput.addEventListener('focus', () => { isSearching = true; });
            searchInput.addEventListener('blur', () => { 
                isSearching = false; 
                setTimeout(() => searchResults.classList.add('hidden'), 200);
            });

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                searchResults.innerHTML = '';

                if (!query) {
                    searchResults.classList.add('hidden');
                    return;
                }

                const filtered = WORLD_COUNTRIES.filter(c => 
                    c.name.toLowerCase().includes(query) || 
                    c.kurdish.includes(query) ||
                    c.code.toLowerCase().includes(query)
                );

                if (filtered.length === 0) {
                    searchResults.classList.add('hidden');
                    return;
                }

                filtered.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'px-4 py-2.5 text-xs hover:bg-cyan-900/50 cursor-pointer flex justify-between items-center transition';
                    div.innerHTML = `
                        <div>
                            <span class="text-cyan-200 font-medium">${item.name}</span>
                            <span class="text-amber-300 text-[10px] block font-bold">${item.kurdish}</span>
                        </div>
                        <span class="text-[10px] text-cyan-400 font-mono">${item.code}</span>
                    `;
                    div.addEventListener('click', () => {
                        focusOnCountry(item);
                        searchInput.value = item.name;
                        searchResults.classList.add('hidden');
                    });
                    searchResults.appendChild(div);
                });

                searchResults.classList.remove('hidden');
            });
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            if (aspect > 2.5) {
                camera.position.z = 275;
            }
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate && globeGroup) {
                globeGroup.rotation.y += 0.002;
            }

            // Animate traveling signal pulses along arcs
            if (showArcs && arcPulses.length > 0) {
                arcPulses.forEach(p => {
                    p.progress = (p.progress + p.speed) % 1;
                    p.pulseMesh.position.copy(p.curve.getPoint(p.progress));
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = function() {
            init3D();
        };
    </script>
</body>
</html>
