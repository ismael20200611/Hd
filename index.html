<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D World HD Globe Background - Studio Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- D3.js & TopoJSON -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;600;700&family=Noto+Sans+Arabic:wght@400;700;900&display=swap');

        :root {
            /* Rudaw Default Theme Setup */
            --theme-accent: #ff9900;
            --theme-strong: #ffaa00;
            --theme-warm: #ffdd00;
            --theme-soft: #ffcc66;
            --theme-glow: rgba(255, 153, 0, 0.40);
            --theme-bg-1: #3a1c02;
            --theme-bg-2: #1c0a00;
            --theme-bg-3: #0a0300;
            --atmosphere-color: #ffaa00;
            --side-light-left: 0.28;
            --side-light-right: 0.22;
            --side-light-bottom: 0.12;
            --background-brightness: 1;
            --background-grid-opacity: 0.65;
            --background-flare-opacity: 0.55;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050200;
            font-family: 'Inter', 'Noto Sans Arabic', sans-serif;
            color: #fff;
            user-select: none;
            cursor: default;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        .studio-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .studio-container::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 42%, var(--theme-bg-1) 0%, var(--theme-bg-2) 48%, var(--theme-bg-3) 100%);
            filter: brightness(var(--background-brightness));
        }

        .studio-container::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 34% 78% at 0% 52%, rgba(var(--theme-accent-rgb, 255,153,0), var(--side-light-left)), transparent 72%),
                radial-gradient(ellipse 34% 78% at 100% 52%, rgba(var(--theme-strong-rgb, 255,170,0), var(--side-light-right)), transparent 72%),
                radial-gradient(ellipse 48% 48% at 50% 100%, rgba(var(--theme-warm-rgb, 255,221,0), var(--side-light-bottom)), transparent 75%);
            filter: blur(12px) brightness(var(--background-brightness));
        }

        .tech-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(to right, rgba(var(--theme-accent-rgb, 255,153,0), .13) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(var(--theme-accent-rgb, 255,153,0), .13) 1px, transparent 1px);
            background-size: 64px 64px;
            opacity: var(--background-grid-opacity);
            pointer-events: none;
            z-index: 1;
        }

        .flare-left {
            position: absolute; top: -20%; left: 5%; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(var(--theme-accent-rgb, 255,153,0), .42) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(65px); pointer-events: none; z-index: 1; opacity: var(--background-flare-opacity);
        }

        .flare-right {
            position: absolute; bottom: -20%; right: 5%; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(var(--theme-warm-rgb, 255,221,0), .34) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(65px); pointer-events: none; z-index: 1; opacity: var(--background-flare-opacity);
        }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }

        .glass-panel {
            background: rgba(15, 12, 10, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid color-mix(in srgb, var(--theme-accent) 45%, transparent);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .glass-gold {
            background: rgba(30, 18, 5, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid color-mix(in srgb, var(--theme-warm) 60%, transparent);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.35);
        }

        .auto-hide-menu {
            transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(15, 10, 5, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 153, 0, 0.5); border-radius: 4px; }

        .theme-btn {
            width: 24px; height: 24px; padding: 2px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.18); background: rgba(15,23,42,0.75);
            display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .theme-btn:hover { transform: scale(1.12); }
        .theme-btn.active { border-color: #fff; box-shadow: 0 0 0 2px var(--theme-accent), 0 0 14px var(--theme-glow); }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; display: block; }
        .theme-palette { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; max-width: 320px; }
        
        .custom-color-btn {
            position: relative; width: 24px; height: 24px; padding: 2px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.25); background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
            display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.18s ease; overflow: hidden;
        }
        .custom-color-btn:hover { transform: scale(1.12); }
        .custom-color-btn .custom-dot { width: 14px; height: 14px; background: #ff9900; border: 1px solid rgba(255,255,255,.8); }
        .custom-color-btn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        .ctrl-slider-group {
            display: flex; flex-direction: column; gap: 4px; min-width: 130px; padding: 6px 10px;
            border-radius: 12px; background: rgba(5, 3, 2, 0.7); border: 1px solid rgba(255, 153, 0, 0.22);
        }
        .ctrl-slider-group label { font-size: 9px; font-weight: 700; letter-spacing: .05em; color: var(--theme-soft); display: flex; justify-content: space-between; align-items: center; }
        .ctrl-slider-group input[type="range"] { width: 100%; accent-color: var(--theme-accent); cursor: pointer; height: 4px; }

        .rudaw-btn-badge {
            background: linear-gradient(135deg, #ff9900 0%, #e65c00 100%);
            color: #fff; font-weight: 900; font-family: 'Orbitron', sans-serif;
            border: 1px solid #ffcc00; box-shadow: 0 0 12px rgba(255, 153, 0, 0.6);
            padding: 2px 8px; border-radius: 6px; font-size: 10px; letter-spacing: 0.5px;
        }
        .rudaw-btn-badge:hover { transform: scale(1.08); }

        .arc-mode-btn.active {
            background: rgba(255, 153, 0, 0.3) !important;
            border-color: var(--theme-accent) !important;
            color: #fff !important;
            box-shadow: 0 0 10px var(--theme-glow);
        }

        @media (max-width: 1100px) { .theme-palette { max-width: 240px; } }
    </style>
</head>
<body>
    <div class="studio-container">
        <div class="tech-grid"></div>
        <div class="flare-left"></div>
        <div class="flare-right"></div>

        <div id="canvas-container"></div>

        <!-- Main Studio Top Controller Bar -->
        <div id="unified-menu" class="auto-hide-menu opacity-0 pointer-events-none fixed top-4 left-1/2 transform -translate-x-1/2 z-30 w-11/12 max-w-7xl">
            <div class="glass-panel rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 border border-amber-500/30">
                
                <!-- Logo & Studio Info -->
                <div class="flex items-center gap-3">
                    <div class="relative flex items-center justify-center">
                        <span class="w-3.5 h-3.5 rounded-full bg-amber-400 animate-ping absolute"></span>
                        <span class="w-3.5 h-3.5 rounded-full bg-amber-500"></span>
                    </div>
                    <div>
                        <span class="font-orbitron text-xs text-amber-200 tracking-widest font-bold block">Nwezhyan GLOBE STUDIO</span>
                        <span class="text-[10px] text-amber-400/80">Broadcast Pro Graphics System</span>
                    </div>
                </div>

                <!-- Search Input -->
                <div class="relative flex-1 max-w-xs">
                    <input type="text" id="country-search" placeholder="Search Country / بگەڕێ بۆ وڵات..." 
                           class="w-full bg-slate-950/80 text-xs text-amber-100 placeholder-amber-400/50 px-4 py-2 pl-9 rounded-xl outline-none border border-amber-500/40 focus:border-amber-400 transition-all">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-amber-400 text-xs"></i>
                    <div id="search-results" class="absolute left-0 top-11 w-full glass-panel rounded-xl max-h-52 overflow-y-auto hidden z-40 divide-y divide-amber-800/40"></div>
                </div>

                <!-- Color Palette -->
                <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-black/60 border border-amber-500/20">
                    <span class="text-[9px] text-amber-300/80 font-bold tracking-wider mr-1">COLOR</span>
                    <div class="theme-palette">
                        <button class="rudaw-btn-badge theme-btn active" data-theme="rudaw" title="Rudaw TV Official Theme">News</button>
                        <button class="theme-btn" data-theme="gold" title="Gold"><span class="color-dot" style="background:#ffb300"></span></button>
                        <button class="theme-btn" data-theme="orange" title="Orange"><span class="color-dot" style="background:#ff9f43"></span></button>
                        <button class="theme-btn" data-theme="red" title="Red"><span class="color-dot" style="background:#ff3347"></span></button>
                        <button class="theme-btn" data-theme="blue" title="Blue"><span class="color-dot" style="background:#38bdf8"></span></button>
                        <button class="theme-btn" data-theme="cyan" title="Cyan"><span class="color-dot" style="background:#00e5ff"></span></button>
                        <button class="theme-btn" data-theme="teal" title="Teal"><span class="color-dot" style="background:#14b8a6"></span></button>
                        <button class="theme-btn" data-theme="green" title="Green"><span class="color-dot" style="background:#22e67a"></span></button>
                        <button class="theme-btn" data-theme="purple" title="Purple"><span class="color-dot" style="background:#b56cff"></span></button>
                        <button class="theme-btn" data-theme="white" title="White"><span class="color-dot" style="background:#f8fafc"></span></button>
                        
                        <!-- Custom Theme Color Picker -->
                        <label class="custom-color-btn" title="Custom Theme Color">
                            <span class="color-dot custom-dot"></span>
                            <input id="custom-color" type="color" value="#ff9900">
                        </label>
                    </div>
                </div>

                <!-- Lighting & Atmosphere Controls -->
                <div class="flex flex-wrap items-center gap-2">
                    
                    <!-- Sun Light (0 - 100%) -->
                    <div class="ctrl-slider-group">
                        <label for="sun-light"><span><i class="fa-solid fa-sun text-amber-400 mr-1"></i> SUN</span> <span id="sun-val">100%</span></label>
                        <input id="sun-light" type="range" min="0" max="100" value="100">
                    </div>

                    <!-- Moon Light (0 - 100%) -->
                    <div class="ctrl-slider-group">
                        <label for="moon-light"><span><i class="fa-solid fa-moon text-amber-300 mr-1"></i> MOON</span> <span id="moon-val">60%</span></label>
                        <input id="moon-light" type="range" min="0" max="100" value="60">
                    </div>

                    <!-- Atmosphere Power & Color -->
                    <div class="ctrl-slider-group">
                        <label for="atmos-power">
                            <span><i class="fa-solid fa-globe text-amber-400 mr-1"></i> ATMOS</span> 
                            <span id="atmos-val">80%</span>
                        </label>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <input id="atmos-power" type="range" min="0" max="100" value="80" class="flex-1">
                            <input id="atmos-color-picker" type="color" value="#ffaa00" class="w-4 h-4 rounded cursor-pointer border-0 p-0 bg-transparent" title="Change Atmosphere Color">
                        </div>
                    </div>

                    <!-- Sky Color Picker -->
                    <div class="ctrl-slider-group min-w-0" style="padding: 6px 8px;">
                        <label><span><i class="fa-solid fa-palette text-amber-400 mr-1"></i> SKY</span></label>
                        <input id="sky-color-picker" type="color" value="#3a1c02" class="w-full h-4 rounded cursor-pointer border-0 p-0 bg-transparent mt-0.5" title="Change Sky Background Color">
                    </div>

                    <!-- Ambient BG Light (0 - 100%) -->
                    <div class="ctrl-slider-group">
                        <label for="background-brightness"><span><i class="fa-solid fa-lightbulb text-amber-300 mr-1"></i> BG LIGHT</span> <span id="brightness-value">100%</span></label>
                        <input id="background-brightness" type="range" min="0" max="500" value="100">
                    </div>
                </div>

                <!-- Action Controls -->
                <div class="flex items-center gap-2">
                    <button id="btn-highlight-kurdistan" class="glass-gold hover:bg-amber-900/60 text-amber-300 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-location-dot text-amber-400"></i> Kurdistan
                    </button>
                    
                    <div class="flex items-center bg-black/60 p-1 rounded-xl border border-amber-500/30 gap-1">
                        <button id="btn-arcs-inside" class="arc-mode-btn active text-amber-200 px-2 py-1 rounded-lg text-xs flex items-center gap-1 transition">
                            <i class="fa-solid fa-arrow-down-to-line"></i> In
                        </button>
                        <button id="btn-arcs-outside" class="arc-mode-btn text-amber-200 px-2 py-1 rounded-lg text-xs flex items-center gap-1 transition">
                            <i class="fa-solid fa-arrow-up-from-line"></i> Out
                        </button>
                        <button id="btn-arcs-none" class="arc-mode-btn text-amber-200 px-2 py-1 rounded-lg text-xs flex items-center gap-1 transition">
                            <i class="fa-solid fa-eye-slash"></i> Off
                        </button>
                    </div>

                    <!-- Directed Arc Route: FROM -> TO. When both are empty, the original multi-country arcs remain. -->
                    <div class="flex items-center gap-1 bg-black/60 p-1 rounded-xl border border-amber-500/30">
                        <div class="relative">
                            <input id="arc-from-search" type="text" autocomplete="off"
                                   placeholder="FROM A" title="Arc From Country"
                                   class="w-24 bg-slate-950/80 text-[10px] text-amber-100 placeholder-amber-400/50 px-2 py-1.5 rounded-lg outline-none border border-amber-500/20 focus:border-amber-400 transition-all">
                            <div id="arc-from-results" class="absolute left-0 top-9 w-48 glass-panel rounded-lg max-h-44 overflow-y-auto hidden z-50 divide-y divide-amber-800/40"></div>
                        </div>
                        <i class="fa-solid fa-arrow-right text-amber-400 text-[10px]"></i>
                        <div class="relative">
                            <input id="arc-to-search" type="text" autocomplete="off"
                                   placeholder="TO B" title="Arc To Country"
                                   class="w-24 bg-slate-950/80 text-[10px] text-amber-100 placeholder-amber-400/50 px-2 py-1.5 rounded-lg outline-none border border-amber-500/20 focus:border-amber-400 transition-all">
                            <div id="arc-to-results" class="absolute right-0 top-9 w-48 glass-panel rounded-lg max-h-44 overflow-y-auto hidden z-50 divide-y divide-amber-800/40"></div>
                        </div>
                        <button id="btn-arcs-clear-route" class="text-amber-300 hover:text-white px-1.5 py-1.5 rounded-lg hover:bg-amber-900/50 transition" title="Clear Arc Route">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <button id="toggle-rotation" class="bg-slate-900/80 hover:bg-amber-900/50 text-amber-200 border border-amber-500/30 px-2.5 py-2 rounded-xl text-xs flex items-center gap-1 transition">
                        <i class="fa-solid fa-rotate text-amber-400"></i> Rotate
                    </button>
                    <button id="btn-reset-cam" class="bg-slate-900/80 hover:bg-amber-900/50 text-amber-200 border border-amber-500/30 px-2.5 py-2 rounded-xl text-xs flex items-center gap-1 transition">
                        <i class="fa-solid fa-crosshairs text-amber-400"></i> Center
                    </button>
                </div>

            </div>
        </div>

        <!-- Country Information Card -->
        <div id="country-card" class="auto-hide-menu opacity-0 pointer-events-none fixed z-30 bottom-8 left-8 glass-gold p-5 rounded-2xl w-80 shadow-2xl transition-all duration-300">
            <div class="flex justify-between items-start mb-3 border-b border-amber-500/30 pb-2.5">
                <div>
                    <h3 id="card-country-name" class="font-bold text-base text-amber-300 font-orbitron">COUNTRY NAME</h3>
                    <div id="card-country-kurdish" class="text-sm text-amber-100 font-bold mt-0.5" dir="rtl">ناوی وڵات بە کوردی</div>
                </div>
                <span id="card-code" class="bg-amber-500/20 text-amber-300 text-[11px] font-mono font-semibold px-2.5 py-1 rounded-lg border border-amber-500/40">GEO</span>
            </div>
            <div class="space-y-2 text-xs">
                <div class="flex justify-between text-gray-300">
                    <span>Capital / پایتەخت:</span>
                    <span id="card-capital" class="text-amber-300 font-medium">-</span>
                </div>
                <div class="flex justify-between text-gray-300">
                    <span>Region / کیشوەر:</span>
                    <span id="card-region" class="text-amber-300 font-medium">-</span>
                </div>
                <div class="flex justify-between text-gray-300">
                    <span>Coordinates:</span>
                    <span id="card-coords" class="text-amber-300 font-mono text-[11px]">0° N, 0° E</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let globeGroup, earthMesh, borderLinesGroup, arcsGroup, pinsGroup;
        let mainSunLight, moonLight, ambientLight;
        let arcPulses = [];
        let autoRotate = true;
        let arcDirection = 'inside';
        let worldGeoData = null;
        let highlightedCountryCode = "IRQ";

        // Optional directed arc route. It only becomes active when BOTH countries are selected.
        let arcFromCountryCode = null;
        let arcToCountryCode = null;
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        /* Theme Color Palettes (Including Rudaw Theme) */
        const THEMES = {
            rudaw:   { accent:'#ff9900', strong:'#ffaa00', warm:'#ffdd00', soft:'#ffcc66', glow:'rgba(255,153,0,.40)', bg1:'#3a1c02', bg2:'#1c0a00', bg3:'#0a0300', globe:'#7a3b00', country:'#4a2100', ocean:'#1a0a00', atmos:'#ffaa00' },
            gold:    { accent:'#ffd15c', strong:'#ffb300', warm:'#fff0a8', soft:'#ffe6a0', glow:'rgba(255,179,0,.30)', bg1:'#543b12', bg2:'#271b06', bg3:'#100b02', globe:'#9b6700', country:'#684500', ocean:'#2a1904', atmos:'#ffb300' },
            orange:  { accent:'#ff9f43', strong:'#ff6b00', warm:'#ffe08a', soft:'#ffc477', glow:'rgba(255,159,67,.32)', bg1:'#56331a', bg2:'#271508', bg3:'#0f0702', globe:'#a65313', country:'#68300c', ocean:'#2a1205', atmos:'#ff6b00' },
            red:     { accent:'#ff4b5c', strong:'#ff1633', warm:'#ffd166', soft:'#ff9aa5', glow:'rgba(255,51,71,.32)', bg1:'#5a1820', bg2:'#250b12', bg3:'#0d0307', globe:'#8f1d2d', country:'#5b1621', ocean:'#260811', atmos:'#ff1633' },
            blue:    { accent:'#38bdf8', strong:'#00f0ff', warm:'#facc15', soft:'#8be9ff', glow:'rgba(56,189,248,.30)', bg1:'#12345b', bg2:'#07182d', bg3:'#020916', globe:'#07549b', country:'#0c3e70', ocean:'#03142d', atmos:'#00f0ff' },
            cyan:    { accent:'#63f6ff', strong:'#00e5ff', warm:'#b9ffff', soft:'#b8fbff', glow:'rgba(0,229,255,.32)', bg1:'#104b59', bg2:'#06242d', bg3:'#021013', globe:'#087c91', country:'#075968', ocean:'#031b22', atmos:'#00e5ff' },
            teal:    { accent:'#5eead4', strong:'#14b8a6', warm:'#b8fff4', soft:'#b4f5eb', glow:'rgba(20,184,166,.30)', bg1:'#10483f', bg2:'#06251f', bg3:'#02110e', globe:'#087766', country:'#075548', ocean:'#031b18', atmos:'#14b8a6' },
            green:   { accent:'#45f28a', strong:'#00e676', warm:'#e6ff6a', soft:'#9fffc3', glow:'rgba(34,230,122,.30)', bg1:'#103f2b', bg2:'#062419', bg3:'#02100a', globe:'#087a49', country:'#0b5135', ocean:'#031b12', atmos:'#00e676' },
            purple:  { accent:'#c084ff', strong:'#9b4dff', warm:'#f0b8ff', soft:'#dfb8ff', glow:'rgba(181,108,255,.32)', bg1:'#3a1b58', bg2:'#180b2c', bg3:'#08030f', globe:'#6620a1', country:'#43136d', ocean:'#1a0829', atmos:'#9b4dff' },
            white:   { accent:'#f8fafc', strong:'#ffffff', warm:'#dbeafe', soft:'#ffffff', glow:'rgba(248,250,252,.30)', bg1:'#43505f', bg2:'#1c2530', bg3:'#090d13', globe:'#7b8da3', country:'#526276', ocean:'#151d28', atmos:'#ffffff' }
        };

        let currentTheme = THEMES.rudaw;
        let atmosphereMesh = null;
        let starParticles = null;
        let idleTimer = null;
        let isSearching = false;

        // Initial fallback countries. The full 193 UN member states are loaded below.
        let WORLD_COUNTRIES = [
            { name: "Iraq", kurdish: "عێراق", capital: "Baghdad", lat: 33.31, lon: 44.36, region: "Asia", code: "IRQ" },
            { name: "United States", kurdish: "ویلایەتە یەکگرتووەکانی ئەمریکا", capital: "Washington, D.C.", lat: 38.90, lon: -77.03, region: "Americas", code: "USA" },

        async function loadAllUNCountries() {
            try {
                const response = await fetch(
                    'https://restcountries.com/v3.1/all?fields=name,cca3,capital,latlng,region,unMember'
                );
                if (!response.ok) throw new Error('Country API request failed');

                const data = await response.json();

                const countries193 = data
                    .filter(c => c.unMember === true && c.cca3 && Array.isArray(c.latlng) && c.latlng.length >= 2)
                    .map(c => ({
                        name: c.name?.common || c.name?.official || c.cca3,
                        kurdish: KURDISH_NAMES[c.cca3] || "",
                        capital: Array.isArray(c.capital) && c.capital.length ? c.capital[0] : "-",
                        lat: Number(c.latlng[0]),
                        lon: Number(c.latlng[1]),
                        region: c.region || "-",
                        code: c.cca3
                    }))
                    .sort((a, b) => a.name.localeCompare(b.name));

                if (countries193.length === 193) {
                    WORLD_COUNTRIES = countries193;
                } else if (countries193.length > 0) {
                    console.warn(`UN country list returned ${countries193.length} countries; keeping available results.`);
                    WORLD_COUNTRIES = countries193;
                }

                // Keep Iraq selected by default, exactly like the original project.
                highlightedCountryCode = "IRQ";

                if (globeGroup) {
                    buildGraphicGlobeTexture(worldGeoData);
                    build3DVectorBorders(worldGeoData);
                    buildCityPins();
                    buildArcConnections();
                }

                const searchInput = document.getElementById('country-search');
                if (searchInput) {
                    searchInput.placeholder = `Search 193 Countries / بگەڕێ بۆ وڵات...`;
                }

                console.log(`Loaded ${WORLD_COUNTRIES.length} UN member states.`);
            } catch (error) {

        function normalizeCountryName(name) {
            return String(name || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/&/g, "and")
                .replace(/[^a-z0-9]+/g, "");
        }

        function isCountryMatch(feature, code) {
            if (!feature || !code) return false;

            const mapName = feature.properties && feature.properties.name;
            if (!mapName) return false;

            const country = WORLD_COUNTRIES.find(c => c.code === code);
            if (!country) return false;

            const a = normalizeCountryName(mapName);
            const b = normalizeCountryName(country.name);

            // Common names used by the world-atlas dataset.
            const aliases = {
                "USA": ["unitedstatesofamerica", "unitedstates"],
                "GBR": ["unitedkingdom"],
                "RUS": ["russianfederation", "russia"],
                "KOR": ["republicofkorea", "southkorea"],
                "PRK": ["democraticpeoplesrepublicofkorea", "northkorea"],
                "TUR": ["turkiye", "turkey"],
                "IRN": ["iran", "islamicrepublicofiran"],
                "SYR": ["syrianarabrepublic", "syria"],
                "LAO": ["laopeoplesdemocraticrepublic", "laos"],
                "VNM": ["vietnamsocialistrepublic", "vietnam"],
                "TZA": ["unitedrepublicoftanzania", "tanzania"],
                "BOL": ["plurinationalstateofbolivia", "bolivia"],
                "VEN": ["bolivarianrepublicofvenezuela", "venezuela"],
                "COD": ["democraticrepublicofthecongo", "democraticrepublicofthecongo"],
                "COG": ["republicofthecongo", "congo"],
                "CZE": ["czechia", "czechrepublic"],
                "MDA": ["republicofmoldova", "moldova"],
                "MKD": ["northmacedonia", "macedonia"],
                "SWZ": ["eswatini", "swaziland"]
            };

            return a === b ||
                a.includes(b) ||
                b.includes(a) ||
                (aliases[code] && aliases[code].includes(a));
        }

        function buildGraphicGlobeTexture(geoData) {
            if (earthMesh) {
                globeGroup.remove(earthMesh);
                earthMesh.geometry.dispose();
                earthMesh.material.dispose();
                if (earthMesh.material.map) earthMesh.material.map.dispose();
            }

            const sphereGeo = new THREE.SphereGeometry(80, 128, 128);
            const canvas = document.createElement('canvas');
            canvas.width = 4096; canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = currentTheme.ocean;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const projection = d3.geoEquirectangular()
                .translate([canvas.width / 2, canvas.height / 2])
                .scale(canvas.width / (2 * Math.PI));
            const path = d3.geoPath().projection(projection).context(ctx);

            const graticule = d3.geoGraticule().step([10, 10]);
            ctx.beginPath(); path(graticule());
            ctx.strokeStyle = currentTheme.glow; ctx.lineWidth = 1.2; ctx.stroke();

            if (geoData) {
                geoData.features.forEach(feature => {
                    ctx.beginPath(); path(feature);
                    ctx.fillStyle = currentTheme.country; ctx.fill();
                    ctx.strokeStyle = currentTheme.accent; ctx.lineWidth = 1.8; ctx.stroke();
                });

                if (highlightedCountryCode) {
                    const targetFeature = geoData.features.find(f => isCountryMatch(f, highlightedCountryCode));
                    if (targetFeature) {
                        ctx.beginPath(); path(targetFeature);
                        ctx.fillStyle = currentTheme.warm; ctx.globalAlpha = 0.45; ctx.fill();
                        ctx.globalAlpha = 1; ctx.strokeStyle = currentTheme.warm; ctx.lineWidth = 4.0;
                        ctx.shadowColor = currentTheme.warm; ctx.shadowBlur = 15; ctx.stroke(); ctx.shadowBlur = 0;
                    }
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            const earthMat = new THREE.MeshStandardMaterial({
                map: texture, roughness: 0.35, metalness: 0.25,
                emissive: new THREE.Color(currentTheme.ocean), emissiveIntensity: 0.8
            });
            earthMesh = new THREE.Mesh(sphereGeo, earthMat);
            globeGroup.add(earthMesh);
        }

        function build3DVectorBorders(geoData) {
            if (!geoData) return;
            if (borderLinesGroup) globeGroup.remove(borderLinesGroup);
            borderLinesGroup = new THREE.Group();

            const borderMat = new THREE.LineBasicMaterial({ color: new THREE.Color(currentTheme.accent), transparent: true, opacity: 0.95 });
            const goldBorderMat = new THREE.LineBasicMaterial({ color: new THREE.Color(currentTheme.warm), transparent: true, opacity: 1.0 });

            geoData.features.forEach(feature => {
                const isHighlighted = highlightedCountryCode && isCountryMatch(feature, highlightedCountryCode);
                const mat = isHighlighted ? goldBorderMat : borderMat;
                const radiusOffset = isHighlighted ? 80.5 : 80.3;
                const geom = feature.geometry;
                const coordinates = geom.type === 'Polygon' ? [geom.coordinates] : geom.type === 'MultiPolygon' ? geom.coordinates : [];

                coordinates.forEach(polygon => {
                    polygon.forEach(ring => {
                        const points = ring.map(coord => latLongToVector3(coord[1], coord[0], radiusOffset));
                        if (points.length > 1) {
                            borderLinesGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), mat));
                        }
                    });
                });
            });
            globeGroup.add(borderLinesGroup);
        }

                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.copy(pos);
                ring.lookAt(0, 0, 0);
                pinsGroup.add(pin, ring);
            });
            globeGroup.add(pinsGroup);

        function buildStarfield() {
            const count = 900;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 700;
                positions[i + 1] = (Math.random() - 0.5) * 700;
                positions[i + 2] = (Math.random() - 0.5) * 700;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: new THREE.Color(currentTheme.accent), size: 1.2, transparent: true, opacity: 0.55 });
            starParticles = new THREE.Points(geometry, material);
            scene.add(starParticles);
        }

        function createCustomTheme(hex) {
            const color = new THREE.Color(hex);
            const hsl = {};
            color.getHSL(hsl);

            const accent = '#' + color.getHexString();
            const strongColor = new THREE.Color().setHSL(hsl.h, Math.min(1, hsl.s + 0.08), Math.min(0.72, hsl.l + 0.02));
            const warmColor = new THREE.Color().setHSL((hsl.h + 0.12) % 1, Math.min(1, hsl.s + 0.05), Math.min(0.88, hsl.l + 0.25));
            const softColor = new THREE.Color().setHSL(hsl.h, Math.max(0.18, hsl.s * 0.72), Math.min(0.9, hsl.l + 0.30));
            const bg1 = new THREE.Color().setHSL(hsl.h, Math.min(0.72, hsl.s + 0.02), 0.16);
            const bg2 = new THREE.Color().setHSL(hsl.h, Math.min(0.68, hsl.s), 0.075);
            const bg3 = new THREE.Color().setHSL(hsl.h, Math.min(0.62, hsl.s), 0.025);

            return {
                accent, strong: '#' + strongColor.getHexString(), warm: '#' + warmColor.getHexString(), soft: '#' + softColor.getHexString(),
                glow: `rgba(${Math.round(color.r * 255)},${Math.round(color.g * 255)},${Math.round(color.b * 255)},.32)`,
                bg1: '#' + bg1.getHexString(), bg2: '#' + bg2.getHexString(), bg3: '#' + bg3.getHexString(),
                globe: '#' + strongColor.getHexString(), country: '#' + bg1.getHexString(), ocean: '#' + bg3.getHexString(), atmos: accent
            };
        }

        function hexToRgbString(hex) {
            const clean = hex.replace('#', '');
            const value = parseInt(clean, 16);
            return `${(value >> 16) & 255},${(value >> 8) & 255},${value & 255}`;
        }

        function updateThemeRgbVariables(theme) {
            const root = document.documentElement;
            root.style.setProperty('--theme-accent-rgb', hexToRgbString(theme.accent));
            root.style.setProperty('--theme-strong-rgb', hexToRgbString(theme.strong));
            root.style.setProperty('--theme-warm-rgb', hexToRgbString(theme.warm));
        }

        function applyThemeObject(theme, name) {
            currentTheme = theme;
            const root = document.documentElement;
            root.style.setProperty('--theme-accent', currentTheme.accent);
            root.style.setProperty('--theme-strong', currentTheme.strong);
            root.style.setProperty('--theme-warm', currentTheme.warm);
            root.style.setProperty('--theme-soft', currentTheme.soft);
            root.style.setProperty('--theme-glow', currentTheme.glow);
            root.style.setProperty('--theme-bg-1', currentTheme.bg1);
            root.style.setProperty('--theme-bg-2', currentTheme.bg2);
            root.style.setProperty('--theme-bg-3', currentTheme.bg3);
            updateThemeRgbVariables(currentTheme);

            // Sync Sky & Atmosphere Pickers
            const skyPicker = document.getElementById('sky-color-picker');
            const atmosPicker = document.getElementById('atmos-color-picker');
            if (skyPicker) skyPicker.value = currentTheme.bg1;
            if (atmosPicker) atmosPicker.value = currentTheme.atmos || currentTheme.strong;

            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.theme === name));

            if (worldGeoData && globeGroup) {
                buildGraphicGlobeTexture(worldGeoData);
                build3DVectorBorders(worldGeoData);
                buildAtmosphere();
                buildCityPins();
                buildArcConnections();
            }
            if (starParticles) starParticles.material.color.set(currentTheme.accent);
        }

        function applyTheme(name) {
            if (!THEMES[name]) return;
            applyThemeObject(THEMES[name], name);
        }

        function latLongToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -(radius * Math.sin(phi) * Math.cos(theta)),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        function handleUserActivity(event) {
            if (event && event.type === 'mousemove') {
                onHoverRaycast(event);
            }

            const menu = document.getElementById('unified-menu');
            menu.classList.remove('opacity-0', 'pointer-events-none');
            menu.classList.add('opacity-100');

            clearTimeout(idleTimer);

            if (!isSearching) {
                idleTimer = setTimeout(() => {
                    menu.classList.remove('opacity-100');
                    menu.classList.add('opacity-0', 'pointer-events-none');
                    
                    const card = document.getElementById('country-card');
                    card.classList.remove('opacity-100');
                    card.classList.add('opacity-0', 'pointer-events-none');
                }, 1500);
            }
        }

        function onHoverRaycast(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pinsGroup.children);
            const card = document.getElementById('country-card');

            if (intersects.length > 0) {
                const target = intersects[0].object;
                if (target.userData && target.userData.name) {
                    showCountryCard(target.userData);
                    return;
                }
            }
            card.classList.remove('opacity-100');
            card.classList.add('opacity-0', 'pointer-events-none');
        }

        function showCountryCard(data) {
            const card = document.getElementById('country-card');
            document.getElementById('card-country-name').textContent = data.name.toUpperCase();
            document.getElementById('card-country-kurdish').textContent = data.kurdish;
            document.getElementById('card-capital').textContent = data.capital;
            document.getElementById('card-region').textContent = data.region;
            document.getElementById('card-code').textContent = data.code;
            document.getElementById('card-coords').textContent = `${data.lat.toFixed(2)}° N, ${data.lon.toFixed(2)}° E`;

            card.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.add('opacity-100');
        }

        function focusOnCountry(country) {
            highlightedCountryCode = country.code;
            if (worldGeoData) {
                buildGraphicGlobeTexture(worldGeoData);
                build3DVectorBorders(worldGeoData);
                buildCityPins();
                buildArcConnections();
            }
            showCountryCard(country);

            const targetPos = latLongToVector3(country.lat, country.lon, 230);
            let startTime = null;
            const startPos = camera.position.clone();

            function animateCam(time) {
                if (!startTime) startTime = time;
                const progress = Math.min((time - startTime) / 1000, 1);
                camera.position.lerpVectors(startPos, targetPos, progress);
                controls.update();
                if (progress < 1) requestAnimationFrame(animateCam);
            }
            requestAnimationFrame(animateCam);
        }

        function getArcSearchMatches(query) {
            const q = String(query || '').trim().toLowerCase();
            if (!q) return WORLD_COUNTRIES.slice(0, 12);

            return WORLD_COUNTRIES.filter(country => {
                const name = String(country.name || '').toLowerCase();
                const kurdish = String(country.kurdish || '').toLowerCase();
                const code = String(country.code || '').toLowerCase();
                const capital = String(country.capital || '').toLowerCase();
                return name.includes(q) || kurdish.includes(q) || code.includes(q) || capital.includes(q);
            }).slice(0, 12);
        }

        function renderArcCountryResults(inputId, resultsId, matches, side) {
            const results = document.getElementById(resultsId);
            if (!results) return;

            results.innerHTML = matches.map(country => `
                <button type="button" class="w-full text-left px-3 py-2 hover:bg-amber-900/60 transition text-amber-100 text-[10px] flex items-center justify-between gap-2" data-arc-code="${country.code}">
                    <span class="truncate">${country.name}</span>
                    <span class="text-amber-400/70 text-[9px]">${country.code}</span>
                </button>
            `).join('');

            results.querySelectorAll('[data-arc-code]').forEach(button => {
                button.addEventListener('click', () => {
                    const country = WORLD_COUNTRIES.find(c => c.code === button.dataset.arcCode);
                    if (!country) return;

                    document.getElementById(inputId).value = country.name;
                    if (side === 'from') arcFromCountryCode = country.code;
                    if (side === 'to') arcToCountryCode = country.code;

                    results.classList.add('hidden');
                    buildArcConnections();
                    handleUserActivity();
                });
            });

            results.classList.toggle('hidden', matches.length === 0);
        }

        function setupArcRouteSearch(inputId, resultsId, side) {
            const input = document.getElementById(inputId);
            const results = document.getElementById(resultsId);
            if (!input || !results) return;

            input.addEventListener('focus', () => {
                renderArcCountryResults(inputId, resultsId, getArcSearchMatches(input.value), side);
            });

            input.addEventListener('input', () => {
                // Typing a new value clears the old selected route endpoint until a country is chosen.
                if (side === 'from') arcFromCountryCode = null;
                if (side === 'to') arcToCountryCode = null;
                renderArcCountryResults(inputId, resultsId, getArcSearchMatches(input.value), side);
                buildArcConnections();
                handleUserActivity();
            });

            input.addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    const matches = getArcSearchMatches(input.value);
                    if (matches.length) {
                        const country = matches[0];
                        input.value = country.name;
                        if (side === 'from') arcFromCountryCode = country.code;
                        if (side === 'to') arcToCountryCode = country.code;
                        results.classList.add('hidden');
                        buildArcConnections();
                        handleUserActivity();
                    }
                }
                if (event.key === 'Escape') results.classList.add('hidden');
            });

            document.addEventListener('click', event => {
                if (!input.contains(event.target) && !results.contains(event.target)) {
                    results.classList.add('hidden');
                }
            });
        }

        function clearArcRoute() {
            arcFromCountryCode = null;
            arcToCountryCode = null;
            const from = document.getElementById('arc-from-search');
            const to = document.getElementById('arc-to-search');
            if (from) from.value = '';
            if (to) to.value = '';
            document.getElementById('arc-from-results')?.classList.add('hidden');
            document.getElementById('arc-to-results')?.classList.add('hidden');
            buildArcConnections();
            handleUserActivity();
        }

        function setupUIInteractions() {
            // Directed Arc A -> B country search controls
            setupArcRouteSearch('arc-from-search', 'arc-from-results', 'from');
            setupArcRouteSearch('arc-to-search', 'arc-to-results', 'to');
            document.getElementById('btn-arcs-clear-route')?.addEventListener('click', clearArcRoute);

            // Theme Select
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    applyTheme(btn.dataset.theme);
                    handleUserActivity();
                });
            });

            // Custom Theme Color Picker
            document.getElementById('custom-color').addEventListener('input', (e) => {
                applyThemeObject(createCustomTheme(e.target.value), 'custom');
                document.querySelector('.custom-color-btn .custom-dot').style.background = e.target.value;
                handleUserActivity();
            });

            // Sun Light Slider (0 - 100%)
            const sunSlider = document.getElementById('sun-light');
            sunSlider.addEventListener('input', (e) => {
                const val = Number(e.target.value);
                document.getElementById('sun-val').textContent = `${val}%`;
                mainSunLight.intensity = (val / 100) * 3.2;
                handleUserActivity();
            });

            // Moon Light Slider (0 - 100%)
            const moonSlider = document.getElementById('moon-light');
            moonSlider.addEventListener('input', (e) => {
                const val = Number(e.target.value);
                document.getElementById('moon-val').textContent = `${val}%`;
                moonLight.intensity = (val / 100) * 2.5;
                handleUserActivity();
            });

            // Atmosphere Power Slider (0 - 100%)
            const atmosSlider = document.getElementById('atmos-power');
            atmosSlider.addEventListener('input', (e) => {
                document.getElementById('atmos-val').textContent = `${e.target.value}%`;
                buildAtmosphere();
                handleUserActivity();
            });

            // Atmosphere Color Picker
            document.getElementById('atmos-color-picker').addEventListener('input', () => {
                buildAtmosphere();
                handleUserActivity();
            });

            // Sky Background Color Picker
            document.getElementById('sky-color-picker').addEventListener('input', (e) => {
                const root = document.documentElement;
                root.style.setProperty('--theme-bg-1', e.target.value);
                root.style.setProperty('--theme-bg-2', e.target.value);
                root.style.setProperty('--theme-bg-3', '#000000');
                handleUserActivity();
            });

            // BG Light Intensity
            const bgLightSlider = document.getElementById('background-brightness');
            bgLightSlider.addEventListener('input', (e) => {
                const val = Number(e.target.value);
                document.getElementById('brightness-value').textContent = `${val}%`;
                document.documentElement.style.setProperty('--background-brightness', (val / 100).toFixed(2));
                handleUserActivity();
            });

            // Toggle Auto-Rotation
            document.getElementById('toggle-rotation').addEventListener('click', () => {
                autoRotate = !autoRotate;
            });

            // Arc Direction Toggle Buttons
            const btnInside = document.getElementById('btn-arcs-inside');
            const btnOutside = document.getElementById('btn-arcs-outside');
            const btnNone = document.getElementById('btn-arcs-none');

            btnInside.addEventListener('click', () => {
                arcDirection = 'inside';
                btnInside.classList.add('active'); btnOutside.classList.remove('active'); btnNone.classList.remove('active');
                buildArcConnections();
            });
            btnOutside.addEventListener('click', () => {
                arcDirection = 'outside';
                btnOutside.classList.add('active'); btnInside.classList.remove('active'); btnNone.classList.remove('active');
                buildArcConnections();
            });
            btnNone.addEventListener('click', () => {
                arcDirection = 'none';
                btnNone.classList.add('active'); btnInside.classList.remove('active'); btnOutside.classList.remove('active');
                buildArcConnections();
            });

            document.getElementById('btn-reset-cam').addEventListener('click', () => {
                camera.position.set(0, 0, 240);
                controls.reset();
            });

            document.getElementById('btn-highlight-kurdistan').addEventListener('click', () => {
                focusOnCountry(WORLD_COUNTRIES[0]);
            });

            // Country Search Bar
            const searchInput = document.getElementById('country-search');
            const searchResults = document.getElementById('search-results');

            searchInput.addEventListener('focus', () => { isSearching = true; });
            searchInput.addEventListener('blur', () => { 
                isSearching = false; 
                setTimeout(() => searchResults.classList.add('hidden'), 200);
            });

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                searchResults.innerHTML = '';

                if (!query) {
                    searchResults.classList.add('hidden');
                    return;
                }

                const filtered = WORLD_COUNTRIES.filter(c => 
                    c.name.toLowerCase().includes(query) || 
                    c.kurdish.toLowerCase().includes(query) ||
                    c.code.toLowerCase().includes(query)
                ).slice(0, 20);

                if (filtered.length === 0) {
                    searchResults.classList.add('hidden');
                    return;
                }

                filtered.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'px-4 py-2.5 text-xs hover:bg-amber-900/50 cursor-pointer flex justify-between items-center transition';
                    div.innerHTML = `
                        <div>
                            <span class="text-amber-200 font-medium">${item.name}</span>
                            <span class="text-amber-400 text-[10px] block font-bold">${item.kurdish}</span>
                        </div>
                        <span class="text-[10px] text-amber-300 font-mono">${item.code}</span>
                    `;
                    div.addEventListener('click', () => {
                        focusOnCountry(item);
                        searchInput.value = item.name;
                        searchResults.classList.add('hidden');
                    });
                    searchResults.appendChild(div);
                });

                searchResults.classList.remove('hidden');
            });

            // Press Enter to immediately select an exact match or the first result.
            searchInput.addEventListener('keydown', (e) => {
                if (e.key !== 'Enter') return;

                const query = searchInput.value.toLowerCase().trim();
                if (!query) return;

                const exact = WORLD_COUNTRIES.find(c =>
                    c.name.toLowerCase() === query ||
                    c.code.toLowerCase() === query ||
                    c.kurdish.toLowerCase() === query
                );

                const first = exact || WORLD_COUNTRIES.find(c =>
                    c.name.toLowerCase().includes(query) ||
                    c.code.toLowerCase().includes(query) ||
                    c.kurdish.toLowerCase().includes(query)
                );

                if (first) {
                    focusOnCountry(first);
                    searchInput.value = first.name;
                    searchResults.classList.add('hidden');
                    searchInput.blur();
                }
            });
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            if (aspect > 2.5) camera.position.z = 275;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate && globeGroup) {
                globeGroup.rotation.y += 0.002;
            }

            if (arcPulses.length > 0) {
                arcPulses.forEach(p => {
                    p.progress = (p.progress + p.speed) % 1;
                    p.pulseMesh.position.copy(p.curve.getPoint(p.progress));
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = function() {
            init3D();
        };
    </script>
</body>
</html>
